<!DOCTYPE html>
<html>
<head>
    <title>Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Contact Us</h1>
</header>

<section class="hero">

    <h2>Get in Touch</h2>

    <form>

        <input
            type="text"
            placeholder="Enter Your Name"
            required
        >

        <br><br>

        <input
            type="email"
            placeholder="Enter Your Email"
            required
        >

        <br><br>

        <textarea
            rows="5"
            cols="40"
            placeholder="Your Message">
        </textarea>

        <br><br>

        <button type="submit">
            Send Message
        </button>

    </form>

</section>

</body>
</html>
